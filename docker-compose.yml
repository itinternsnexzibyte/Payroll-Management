# PostgreSQL 17 + Payroll API + Payroll web.
#   Development database only:  docker compose up -d postgres
#   Whole stack:                create infra/docker/payroll-api.env from the .example file, then
#                               POSTGRES_PASSWORD=<secret> docker compose --profile app up -d --build
# Put an HTTPS reverse proxy (see docs/deployment.md) in front of the web container in production.
name: payroll-management

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexzi_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexzi_dev_only}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexzi_dev}']
      interval: 5s
      retries: 20

  payroll-api:
    profiles: ['app']
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, args: { APP: payroll-api } }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: [infra/docker/payroll-api.env]
    environment:
      RUN_MIGRATIONS: 'true'
    volumes: [payroll-files:/var/lib/nexzi/storage]

  payroll-web:
    profiles: ['app']
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { APP: payroll-web, API_INTERNAL_URL: 'http://payroll-api:4001' } }
    restart: unless-stopped
    environment: { PORT: '3001' }
    depends_on: [payroll-api]
    ports: ['3001:3001']

volumes:
  pgdata:
  payroll-files:
