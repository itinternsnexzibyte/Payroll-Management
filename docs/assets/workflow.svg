<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Payroll workflow</title>
  <desc id="d">Employees and salary versions, then a Draft run with monthly inputs, Calculated with exceptions and alerts, Under review, Approved, Finalised as an immutable snapshot, then payslips and reports. An Administrator can re-open a finalised run with a reason.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C35"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#39D6C5"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18264A"/><stop offset="1" stop-color="#121D38"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .n { fill: #F4F7FB; font-size: 15px; font-weight: 600; }
    .s { fill: #94A3B8; font-size: 12px; }
    .k { fill: #39D6C5; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
    .ring { transform-box: fill-box; transform-origin: center; animation: r 7s ease-in-out infinite; opacity: 0; }
    .r1 { animation-delay: 0s } .r2 { animation-delay: 1s } .r3 { animation-delay: 2s } .r4 { animation-delay: 3s } .r5 { animation-delay: 4s } .r6 { animation-delay: 5s } .r7 { animation-delay: 6s }
    @keyframes r { 0% { opacity: 0; transform: scale(0.8); } 4% { opacity: 1; } 14% { opacity: 0; transform: scale(1.5); } 100% { opacity: 0; } }
    .back { fill: none; stroke: #94A3B8; stroke-opacity: 0.6; stroke-width: 1.6; stroke-dasharray: 5 6; animation: b 2s linear infinite; }
    @keyframes b { to { stroke-dashoffset: 22; } }
    @media (prefers-reduced-motion: reduce) { .ring, .back { animation: none; } }
  </style>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" class="k">PAYROLL WORKFLOW</text>
  <text x="48" y="88" fill="#F4F7FB" font-size="24" font-weight="700">From employee records to locked payslips</text>

  <line x1="112" y1="190" x2="1168" y2="190" stroke="url(#rail)" stroke-width="3" stroke-opacity="0.85"/>
  <circle r="5" fill="#F4F7FB">
    <animateMotion dur="7s" repeatCount="indefinite" path="M112 190 H1168"/>
  </circle>

  <g text-anchor="middle">
    <g transform="translate(112 190)"><circle class="ring r1" r="20" fill="none" stroke="#5B8CFF" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#5B8CFF" stroke-width="2.5"/><text y="5" fill="#C9D7FF" font-size="13" font-weight="700">1</text></g>
    <g transform="translate(288 190)"><circle class="ring r2" r="20" fill="none" stroke="#5B8CFF" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#5B8CFF" stroke-width="2.5"/><text y="5" fill="#C9D7FF" font-size="13" font-weight="700">2</text></g>
    <g transform="translate(464 190)"><circle class="ring r3" r="20" fill="none" stroke="#6BA3F5" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#6BA3F5" stroke-width="2.5"/><text y="5" fill="#C9D7FF" font-size="13" font-weight="700">3</text></g>
    <g transform="translate(640 190)"><circle class="ring r4" r="20" fill="none" stroke="#4FBBE0" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#4FBBE0" stroke-width="2.5"/><text y="5" fill="#C9EEFF" font-size="13" font-weight="700">4</text></g>
    <g transform="translate(816 190)"><circle class="ring r5" r="20" fill="none" stroke="#45C8D2" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#45C8D2" stroke-width="2.5"/><text y="5" fill="#C1F2F0" font-size="13" font-weight="700">5</text></g>
    <g transform="translate(992 190)"><circle class="ring r6" r="20" fill="none" stroke="#39D6C5" stroke-width="2"/><circle r="14" fill="#39D6C5" stroke="#39D6C5" stroke-width="2.5"/><text y="5" fill="#0B1220" font-size="13" font-weight="700">6</text></g>
    <g transform="translate(1168 190)"><circle class="ring r7" r="20" fill="none" stroke="#39D6C5" stroke-width="2"/><circle r="14" fill="#111C35" stroke="#39D6C5" stroke-width="2.5"/><text y="5" fill="#B6F2EB" font-size="13" font-weight="700">7</text></g>

    <text x="112" y="140" class="n">Employees</text><text x="112" y="244" class="s">Master data and</text><text x="112" y="262" class="s">salary versions</text>
    <text x="288" y="140" class="n">Draft</text><text x="288" y="244" class="s">Start the month;</text><text x="288" y="262" class="s">enter monthly inputs</text>
    <text x="464" y="140" class="n">Calculated</text><text x="464" y="244" class="s">Server calculation;</text><text x="464" y="262" class="s">exceptions and alerts</text>
    <text x="640" y="140" class="n">Under review</text><text x="640" y="244" class="s">Warnings acknowledged;</text><text x="640" y="262" class="s">reconcile months</text>
    <text x="816" y="140" class="n">Approved</text><text x="816" y="244" class="s">Authorised approver</text><text x="816" y="262" class="s">(optional step)</text>
    <text x="992" y="140" class="n">Finalised</text><text x="992" y="244" class="s">Immutable snapshot</text><text x="992" y="262" class="s">(database triggers)</text>
    <text x="1168" y="140" class="n">Outputs</text><text x="1168" y="244" class="s">Payslips and</text><text x="1168" y="262" class="s">reports (PDF/XLSX)</text>
  </g>

  <path class="back" d="M992 290 C 992 344, 464 344, 464 290" marker-end="url(#ar)"/>
  <text x="728" y="358" class="s" text-anchor="middle">Re-open — Administrator only, reason required, audit-logged; payslips are superseded</text>
</svg>
