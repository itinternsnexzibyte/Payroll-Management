<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5B8CFF" stop-opacity="0.65"/>
      <stop offset="0.75" stop-color="#39D6C5" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#39D6C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .glint { animation: m 6s ease-in-out infinite; }
    @keyframes m { 0% { transform: translateX(-200px); } 70%, 100% { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { .glint { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="11" width="1280" height="2" rx="1" fill="url(#l)"/>
  <rect class="glint" x="0" y="10" width="180" height="4" rx="2" fill="url(#g)"/>
  <circle cx="640" cy="12" r="4" fill="#0B1220" stroke="#39D6C5" stroke-width="2"/>
</svg>
