<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="844" viewBox="0 0 1280 844" role="img" aria-labelledby="t d">
  <title id="t">Feature overview</title>
  <desc id="d">Employee master, versioned salary structures, monthly payroll engine, review and finalisation, payslips and reports, payroll alerts, reconciliation, knowledge centre, security and audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C35"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18264A"/><stop offset="1" stop-color="#121D38"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#39D6C5" stop-opacity="0.15"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#39D6C5"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5B8CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .halo { transform-box: fill-box; transform-origin: center; animation: h 5s ease-in-out infinite; }
    .d1 { animation-delay: -0.5s } .d2 { animation-delay: -1s } .d3 { animation-delay: -1.5s } .d4 { animation-delay: -2s } .d5 { animation-delay: -2.5s } .d6 { animation-delay: -3s } .d7 { animation-delay: -3.5s } .d8 { animation-delay: -4s }
    @keyframes h { 0%, 100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .halo { animation: none; } }
    .t { fill: #F4F7FB; font-size: 21px; font-weight: 600; }
    .s { fill: #94A3B8; font-size: 15px; }
    .k { fill: #39D6C5; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
    .i { fill: none; stroke: url(#ic); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1280" height="844" rx="24" fill="url(#bg)"/>

  <!-- Row 1 -->
  <g transform="translate(40 40)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><circle cx="9" cy="7" r="5"/><path d="M0 24c0-5 4-9 9-9s9 4 9 9"/><circle cx="20" cy="9" r="3.5"/><path d="M19 15c3 0 6 3 6 7"/></g>
    <text x="32" y="122" class="k">PEOPLE</text>
    <text x="32" y="150" class="t">Employee master</text>
    <text x="32" y="178" class="s">Search, filter and sort; CSV/XLSX import</text>
    <text x="32" y="200" class="s">with row-level errors; export; exits are</text>
    <text x="32" y="222" class="s">recorded, never hard-deleted.</text>
  </g>
  <g transform="translate(448 40)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d1" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><path d="M2 22V8M9 22V3M16 22V11M23 22V6"/><path d="M0 24h25"/></g>
    <text x="32" y="122" class="k">SALARY</text>
    <text x="32" y="150" class="t">Versioned salary structures</text>
    <text x="32" y="178" class="s">Fixed, percentage, monthly-input and</text>
    <text x="32" y="200" class="s">approved-formula components; effective</text>
    <text x="32" y="222" class="s">dates and a full change history.</text>
  </g>
  <g transform="translate(856 40)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d2" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><rect x="1" y="1" width="22" height="24" rx="3"/><path d="M6 7h12M6 13h3M12 13h2M17 13h1M6 19h3M12 19h2M17 19h1"/></g>
    <text x="32" y="122" class="k">PAYROLL</text>
    <text x="32" y="150" class="t">Monthly payroll engine</text>
    <text x="32" y="178" class="s">Excel-like input grid with paste; decimal-</text>
    <text x="32" y="200" class="s">safe, deterministic calculation on the</text>
    <text x="32" y="222" class="s">server, with an exceptions panel.</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40 304)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d3" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><rect x="3" y="11" width="18" height="13" rx="3"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 16v3"/></g>
    <text x="32" y="122" class="k">CONTROL</text>
    <text x="32" y="150" class="t">Review and finalisation</text>
    <text x="32" y="178" class="s">Draft → Calculated → Under review →</text>
    <text x="32" y="200" class="s">Approved → Finalised. Immutable snapshots;</text>
    <text x="32" y="222" class="s">re-open needs an Administrator and a reason.</text>
  </g>
  <g transform="translate(448 304)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d4" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><path d="M4 1h11l6 6v18H4z"/><path d="M15 1v6h6M8 13h9M8 18h9"/></g>
    <text x="32" y="122" class="k">OUTPUTS</text>
    <text x="32" y="150" class="t">Payslips and reports</text>
    <text x="32" y="178" class="s">Stored PDF payslips and bulk print; summary,</text>
    <text x="32" y="200" class="s">earnings, deductions, net payable and</text>
    <text x="32" y="222" class="s">employee statements as PDF or XLSX.</text>
  </g>
  <g transform="translate(856 304)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d5" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#39D6C5" fill-opacity="0.12" stroke="#39D6C5" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><path d="M12 1l10 4v7c0 6-4 10-10 13C6 22 2 18 2 12V5z"/><path d="M12 8v6M12 18v.5"/></g>
    <text x="32" y="122" class="k">CHANGE REQUEST A</text>
    <text x="32" y="150" class="t">Payroll alerts</text>
    <text x="32" y="178" class="s">Explainable, configurable checks against</text>
    <text x="32" y="200" class="s">earlier finalised months, with a review</text>
    <text x="32" y="222" class="s">outcome and an append-only history.</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(40 568)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d6" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#39D6C5" fill-opacity="0.12" stroke="#39D6C5" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><path d="M2 8h20l-5-5M24 18H4l5 5"/></g>
    <text x="32" y="122" class="k">CHANGE REQUEST B</text>
    <text x="32" y="150" class="t">Reconciliation</text>
    <text x="32" y="178" class="s">Any two months, employee- and component-</text>
    <text x="32" y="200" class="s">wise; explain each difference as expected</text>
    <text x="32" y="222" class="s">or a discrepancy; export PDF/XLSX.</text>
  </g>
  <g transform="translate(448 568)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d7" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#39D6C5" fill-opacity="0.12" stroke="#39D6C5" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><path d="M1 4c4-2 8-2 11 1v19c-3-3-7-3-11-1z"/><path d="M23 4c-4-2-8-2-11 1v19c3-3 7-3 11-1z"/></g>
    <text x="32" y="122" class="k">CHANGE REQUEST F</text>
    <text x="32" y="150" class="t">Knowledge centre</text>
    <text x="32" y="178" class="s">Versioned procedures and rules with owners</text>
    <text x="32" y="200" class="s">and review dates; undocumented items are</text>
    <text x="32" y="222" class="s">flagged; a monthly checklist per run.</text>
  </g>
  <g transform="translate(856 568)">
    <rect width="384" height="248" rx="18" fill="url(#card)" stroke="url(#edge)"/>
    <circle class="halo d8" cx="56" cy="58" r="34" fill="url(#glow)"/><rect x="32" y="34" width="48" height="48" rx="13" fill="#5B8CFF" fill-opacity="0.12" stroke="#5B8CFF" stroke-opacity="0.35"/>
    <g class="i" transform="translate(44 46)"><circle cx="12" cy="12" r="11"/><path d="M7 12l3.5 3.5L17 9"/></g>
    <text x="32" y="122" class="k">TRUST</text>
    <text x="32" y="150" class="t">Security and audit</text>
    <text x="32" y="178" class="s">Permission checks on every endpoint, hashed</text>
    <text x="32" y="200" class="s">sessions, CSRF origin checks, email-verified</text>
    <text x="32" y="222" class="s">sign-up and an append-only audit log.</text>
  </g>
</svg>
