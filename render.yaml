# Render Blueprint: PostgreSQL + Payroll API (Docker, with Chromium for PDFs) + Payroll web (Next.js).
# Dashboard → Blueprints → New Blueprint Instance → pick this repository.
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
# See docs/deployment.md ("Render") for the settings and email notes.

databases:
  - name: payroll-db
    databaseName: payroll
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: payroll-api
    runtime: docker
    plan: starter # a persistent disk needs a paid plan; free instances also block SMTP ports
    region: singapore
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    disk:
      name: payroll-storage
      mountPath: /var/lib/nexzi/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://payroll-web.onrender.com # change if the web service URL differs
      - key: PUBLIC_API_PREFIX
        value: /api
      - key: COOKIE_SECURE
        value: true
      # Requests reach the API through Render's proxy and then the web app's /api proxy (2 hops).
      - key: TRUST_PROXY
        value: 2
      - key: STORAGE_DIR
        value: /var/lib/nexzi/storage
      - key: RUN_MIGRATIONS
        value: true
      - key: SIGNUP_ENABLED
        value: true
      - key: SIGNUP_REQUIRE_APPROVAL
        value: false
      # Email (Gmail): SMTP_HOST is the server name, not an address. SMTP_PASSWORD is a Google App Password.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYSLIP_COMPANY_NAME
        value: Nexzibyte Solutions
      - key: PAYROLL_RULES_APPROVED
        value: false
      - key: PAYSLIP_FORMAT_APPROVED
        value: false
      - key: VIEWER_ROLE_ENABLED
        value: false
      # Optional: first Administrator, created at start-up if none exists.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: payroll-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: infra/docker/web.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: HOSTNAME
        value: 0.0.0.0
      # "host:port" on Render's private network; next.config.ts adds http:// when it is missing.
      - key: API_INTERNAL_URL
        fromService:
          name: payroll-api
          type: web
          property: hostport
